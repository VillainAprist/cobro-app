name: proyecto_cobro
description: Sistema de Registro y Control de Préstamos local con respaldos y notificaciones.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Almacenamiento Local (Móvil y Escritorio/Web FFI)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  
  # Notificaciones Locales y Acciones
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  url_launcher: ^6.3.1
  
  # Firebase Nube (Respaldo Automático)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  
  # Formato, Exportación y Respaldos
  intl: ^0.19.0
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
